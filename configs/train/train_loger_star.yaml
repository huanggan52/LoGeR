# @package _global_

trainer: trainers.loger_trainer.LoGeRTrainer

train:
  sequence_length: 128
  max_img_per_gpu: 128
  window_size_range: [8, 12]
  overlap_size_range: [2, 3]
  iters_per_epoch: 1500
  se3: true

  # low resolution
  resolution: 
    - [504, 280]

model:
  ckpt: ckpts/LoGeR_star/latest.pt